<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prensa Municipal | SRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Mantenemos tu estética original */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f2f5; }
        .news-header { background: linear-gradient(135deg, #004a99, #007bff); color: white; padding: 60px 20px; text-align: center; }
        .news-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: -30px auto 50px; padding: 0 20px; }
        .news-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .news-image { position: relative; height: 210px; }
        .news-image img { width: 100%; height: 100%; object-fit: cover; }
        .news-tag { position: absolute; top: 15px; right: 15px; background: #28a745; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .news-content { padding: 25px; }
        .more-info { max-height: 0; overflow: hidden; transition: 0.4s ease-out; opacity: 0; font-size: 0.95rem; color: #444; }
        .more-info.show { max-height: 500px; opacity: 1; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .btn-more { background: none; border: none; color: #007bff; font-weight: 600; cursor: pointer; padding: 15px 0 0; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header class="news-header">
        <h1>Prensa Municipal</h1>
        <p>Gestión en tiempo real - San Rafael de Onoto</p>
    </header>

    <main class="news-container" id="contenedor-noticias">
        <p style="text-align: center; grid-column: 1/-1;">Cargando noticias oficiales...</p>
    </main>

    <script>
        // PEGA AQUÍ TU ENLACE DE "PUBLICAR EN LA WEB" (EL QUE TERMINA EN .csv)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCgMqpSqWlNC2jiDXOl_mkKzu5a1tx3xWwFT43OO5TPfHmD9__apToPRf9cvLHsCeHZFpK5i9kEaSZ/pub?output=csv';

        async function cargarNoticias() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const filas = data.split('\n').slice(1); // Ignorar la primera fila de títulos
                const contenedor = document.getElementById('contenedor-noticias');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                filas.forEach((fila, index) => {
                    const columnas = fila.split(','); // Divide por comas
                    if (columnas.length < 5) return;

                    const [titulo, resumen, detalle, imagen, tag, fecha] = columnas;

                    const card = `
                        <article class="news-card">
                            <div class="news-image">
                                <img src="${imagen}" alt="Noticia">
                                <span class="news-tag">${tag}</span>
                            </div>
                            <div class="news-content">
                                <span style="font-size:0.8rem; color:#888">${fecha}</span>
                                <h3>${titulo}</h3>
                                <p>${resumen}</p>
                                <div id="info-${index}" class="more-info">${detalle}</div>
                                <button class="btn-more" onclick="toggleInfo('info-${index}', this)">Leer noticia completa ↓</button>
                            </div>
                        </article>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                console.error("Error cargando noticias:", error);
            }
        }

        function toggleInfo(id, btn) {
            const info = document.getElementById(id);
            info.classList.toggle('show');
            btn.innerHTML = info.classList.contains('show') ? "Ver menos ↑" : "Leer noticia completa ↓";
        }

        cargarNoticias();
    </script>
</body>

</html>
